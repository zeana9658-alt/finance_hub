name: finance_hub
description: "聚账 · FinanceHub —— 本地优先的个人财务数据可视化聚合器"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 本地数据库
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # 账单解析
  file_picker: ^13.1.0
  excel: ^4.0.6
  csv: ^8.0.0
  charset: ^2.0.1          # 纯 Dart GBK/GB18030 解码（Android + Windows 均可用）

  # 工具
  intl: ^0.20.3
  crypto: ^3.0.7
  collection: ^1.19.1
  share_plus: ^13.3.1

  # 图表
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
