org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 以下几个开关是为「Windows + 含空格的路径 + 沙箱环境」关闭的：
#  - parallel：与 includeBuild(flutter_tools/gradle) 组合时容易出现构建挂起
#  - caching：构建缓存的清理动作会大量删文件，在沙箱里容易被拦
#  - vfs.watch：文件系统监听在 Windows 上偶发挂起
#  - daemon：避免守护进程卡死时难以诊断
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.daemon=false
# 关键：禁止 AGP 自动通过 sdkmanager 下载缺失的 SDK 组件。
# sdkmanager 的仓库地址硬编码 dl.google.com，在受限网络下会**永久挂起**
# （表现为 Gradle 停在 "Downloading packages..." 不动）。
# 关掉之后缺失组件会立刻报错，便于定位；需要的组件请手动放到 ANDROID_HOME。
android.builder.sdkDownload=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
